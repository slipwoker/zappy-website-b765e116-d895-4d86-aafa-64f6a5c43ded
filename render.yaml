# Render static site routing configuration
# Generated: 2026-05-25T08:07:23.798Z
# More specific routes should be listed before catch-all routes

routes:
  - type: rewrite
    source: /product/*
    destination: /product.html
  - type: rewrite
    source: /category/*
    destination: /category.html
  - type: rewrite
    source: /courses/*
    destination: /courses.html
  - type: rewrite
    source: /lesson/*
    destination: /lesson.html
  - type: rewrite
    source: /certificate/*
    destination: /certificate.html
