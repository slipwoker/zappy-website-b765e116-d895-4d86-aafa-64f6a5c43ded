# Render static site routing configuration
# Generated: 2026-07-05T13:58:36.516Z
# This file configures URL rewrite rules for SPA routing

# Routes are applied when no static file exists at the requested path
# More specific routes should be listed before catch-all routes

routes:
  - type: rewrite
    source: /courses
    destination: /courses/index.html
  - type: rewrite
    source: /courses/
    destination: /courses/index.html
  - type: rewrite
    source: /my-learning
    destination: /my-learning.html
  - type: rewrite
    source: /category/*
    destination: /category.html
  - type: rewrite
    source: /courses/*
    destination: /course-detail.html
  - type: rewrite
    source: /lesson/*
    destination: /lesson.html
  - type: rewrite
    source: /certificate/*
    destination: /certificate.html
  - type: rewrite
    source: /en/category/*
    destination: /en/category/index.html
  - type: rewrite
    source: /en/courses
    destination: /en/courses/index.html
  - type: rewrite
    source: /en/courses/
    destination: /en/courses/index.html
  - type: rewrite
    source: /en/courses/*
    destination: /en/courses/index.html
  - type: rewrite
    source: /en/lesson/*
    destination: /en/lesson/index.html
  - type: rewrite
    source: /en/certificate/*
    destination: /en/certificate/index.html
